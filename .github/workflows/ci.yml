name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python eval.py --no-llm --dataset dev
      - run: python eval.py --no-llm --dataset extended
      # Live evals spend credits and need a key: run them by hand (python eval.py), not in CI.
